# ---------------------------------------------------------------------------
# Dharohar — local development stack
#
# Services:
#   postgres       — primary database
#   redis          — Celery broker + result backend
#   migrate        — runs Alembic migrations once on startup (init container)
#   backend        — FastAPI application (uvicorn)
#   celery-worker  — Celery document-processing worker
#
# Quick start:
#   cp .env.example .env          # fill in secrets
#   docker compose up --build
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: dharohar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dharohar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dharohar}
      POSTGRES_DB: ${POSTGRES_DB:-dharohar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dharohar} -d ${POSTGRES_DB:-dharohar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dharohar-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Alembic migration runner — exits 0 when done; other services wait for it
  # --------------------------------------------------------------------------

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: dharohar-migrate
    # Override the default CMD to run only migrations
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dharohar}:${POSTGRES_PASSWORD:-dharohar}@postgres:5432/${POSTGRES_DB:-dharohar}
      SECRET_KEY: ${SECRET_KEY:-dharohar-secret-key-development-minimum-32-chars-long}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # FastAPI backend
  # --------------------------------------------------------------------------

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: dharohar-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dharohar}:${POSTGRES_PASSWORD:-dharohar}@postgres:5432/${POSTGRES_DB:-dharohar}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dharohar-secret-key-development-minimum-32-chars-long}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_DIR: /app/uploads
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
      ENHANCEMENT_MODEL_PATH: /app/models/enhancement/best.pt
      OCR_MODEL_PATH: /app/models/ocr/best.pt
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CELERY_ALWAYS_EAGER: "false"
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # Celery worker — processes documents asynchronously
  # --------------------------------------------------------------------------

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: dharohar-celery
    # Override the CMD to start the Celery worker
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
      - --queues=celery
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dharohar}:${POSTGRES_PASSWORD:-dharohar}@postgres:5432/${POSTGRES_DB:-dharohar}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dharohar-secret-key-development-minimum-32-chars-long}
      STORAGE_DIR: /app/uploads
      ENHANCEMENT_MODEL_PATH: /app/models/enhancement/best.pt
      OCR_MODEL_PATH: /app/models/ocr/best.pt
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CELERY_ALWAYS_EAGER: "false"
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

# --------------------------------------------------------------------------
# Named volumes
# --------------------------------------------------------------------------

volumes:
  postgres_data:
  uploads_data:
  models_data:
